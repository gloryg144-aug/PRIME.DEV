name: Deploy PRIME/OXYCHEM to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-pages.yml
      - prime-oxychem/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prime-oxychem/package-lock.json

      - name: Install dependencies
        working-directory: prime-oxychem
        run: npm ci

      - name: Lint
        working-directory: prime-oxychem
        run: npm run lint

      - name: Build
        working-directory: prime-oxychem
        env:
          VITE_BASE_PATH: /PRIME.DEV/
          VITE_STATS_API: ${{ vars.VITE_STATS_API }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prime-oxychem/dist

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
