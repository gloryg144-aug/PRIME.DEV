<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRIME | OXYCHEM</title>
    <meta
      name="description"
      content="PRIME builds easy learning experiences for chemistry, visual notes, and digital products through OXYCHEM."
    />
    <meta name="author" content="PRIME" />
    <meta name="theme-color" content="#eaf4fb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/prime-icon-1024.png" />
    <!-- when added to the home screen the site opens full screen, with no browser bars -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PRIME" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Every visit and refresh starts at the lock-screen hero, never at a restored scroll position
      try {
        history.scrollRestoration = 'manual'
        if (location.hash) history.replaceState(null, '', location.pathname + location.search)
        scrollTo(0, 0)
        addEventListener('pageshow', function (e) {
          if (e.persisted) scrollTo(0, 0)
        })
      } catch (e) {}
    </script>
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PRIME | OXYCHEM" />
    <meta property="og:title" content="PRIME | OXYCHEM" />
    <meta
      property="og:description"
      content="Complex chemistry and learning concepts made easier with visual notes, motion, and web experiences."
    />
    <meta name="twitter:card" content="summary" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "OXYCHEM",
        "alternateName": "PRIME",
        "description": "Education brand and digital studio for visual chemistry learning and product design.",
        "sameAs": [
          "https://oxychem-alauddin.lovable.app/#subjects"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site needs JavaScript. Visit PRIME and OXYCHEM: https://oxychem-alauddin.lovable.app/#subjects</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
